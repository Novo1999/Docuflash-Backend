name: Cleanup Expired Files

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete expired files
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call cleanup endpoint
  run: |
    response=$(curl --silent --show-error --fail \
      --request POST \
      --header "x-cleanup-api-key: ${{ secrets.CLEANUP_API_KEY }}" \
      --header "Content-Type: application/json" \
      "${{ secrets.API_BASE_URL }}/api/files/cleanup-expired")

    echo "Response: $response"
    deleted=$(echo "$response" | jq -r '.data.deleted')
    echo "Files deleted: $deleted"

      - name: Report failure
        if: failure()
        run: echo "Cleanup job failed — check your API logs"
