# .github/workflows/cleanup-expired-files.yaml
name: Cleanup Expired Files

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  cleanup:
    name: Delete expired files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production 
    steps:
      - name: Validate secrets
        run: |
          if [ -z "${{ secrets.API_BASE_URL }}" ]; then
            echo "ERROR: API_BASE_URL secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.CLEANUP_API_KEY }}" ]; then
            echo "ERROR: CLEANUP_API_KEY secret is not set"
            exit 1
          fi
          echo "Both secrets are present"

      - name: Call cleanup endpoint
        run: |
          response=$(curl --silent --show-error --fail \
            --request POST \
            --header "x-cleanup-api-key: ${{ secrets.CLEANUP_API_KEY }}" \
            --header "Content-Type: application/json" \
            "${{ secrets.API_BASE_URL }}/api/files/cleanup-expired")

          echo "Response: $response"
          deleted=$(echo "$response" | jq -r '.data.deleted')
          echo "Files deleted: $deleted"

      - name: Report failure
        if: failure()
        run: echo "Cleanup job failed — check your API logs on Vercel"
